kind = "module"
title = "Conjugates and Fenchel–Moreau"
module = "Tdaf.Analysis.Convex.Duality.Conjugate"
namespace = "Tdaf.ConvexAnalysis"
notes = '''
Duality is stated for a dual pair B : E →ₗ[ℝ] F →ₗ[ℝ] ℝ, never for a topological dual.
The separation step of Fenchel–Moreau needs every continuous functional to be some B · y,
which is the IsCompatiblePairing hypothesis.
'''

[[node]]
id = "conj"

[[node]]
id = "biconj"

# No doc comment in the library for these two, so the descriptions stay.
[[node]]
id = "conj_top"
desc = 'The conjugate of the constant +∞ is the constant -∞.'

[[node]]
id = "conj_bot"
desc = 'The conjugate of the constant -∞ is the constant +∞.'

[[node]]
id = "exists_affineFn_le_of_lt"

# Deliberately kept with `desc` and `deps` although it is proved and documented, so that `lint`
# reports both as superseded and `show` reports the unused suggestion: the real proof goes through
# exists_affineFn_le_of_lt and the closure lemmas, not the separation theorem.
[[node]]
id = "biconj_eq_clFn"
desc = 'Fenchel–Moreau: for a compatible pairing and a convex f : E → EReal, f** = cl f.'
deps = ["biconj", "clFn", "exists_separatesStrongly_iff_iSup_lt_iInf"]
source = "Rockafellar, Theorem 12.2"
