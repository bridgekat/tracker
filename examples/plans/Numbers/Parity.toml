# Finished: kinds, doc comments and real dependencies are read from the library, so the nodes
# keep only their id, and the module's doc comment describes the group. One declaration has no
# doc comment and keeps its description.
namespace = "Numbers"

[[node]]
id = "IsEven"

[[node]]
id = "IsOdd"

# On its way out: `isEven_two_mul` covers it. Nothing in the library says so, so `lint` is where
# the deprecation shows, on this node and on `IsEven.add`, which still suggests it.
[[node]]
id = "isEven_zero"
deprecated = 'Subsumed by isEven_two_mul, which gives it at k = 0; use that instead.'

[[node]]
id = "isEven_two_mul"
desc = 'Twice any natural number is even.'

# Deliberately kept with `desc` and `deps` although it is proved and documented, so that `lint`
# reports both as superseded and `show` reports the suggestion the proof did not use.
[[node]]
id = "IsEven.add"
desc = 'The sum of two even numbers is even.'
deps = ["IsEven", "isEven_zero"]
source = "Textbook, Proposition 1.1"

[[node]]
id = "IsEven.add_one_odd"
